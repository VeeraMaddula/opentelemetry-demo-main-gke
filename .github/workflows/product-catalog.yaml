name: product-catalog

on:
  push:
    branches: [main]
    paths:
      - 'src/product-catalog/**'
      - '.github/workflows/product-catalog.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: otel-gke-obervability
  REGION: us-east1
  ZONE: us-east1-b
  CLUSTER: otel-gke-cluster
  IMAGE: us-east1-docker.pkg.dev/otel-gke-obervability/otel-demo/product-catalog

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1056229487697/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions@otel-gke-obervability.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build -t $IMAGE:${{ github.sha }} -f src/product-catalog/Dockerfile .
          docker push $IMAGE:${{ github.sha }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}

      - name: Deploy
        run: |
          kubectl set image deployment/product-catalog product-catalog=$IMAGE:${{ github.sha }} -n astronomy-shop
          kubectl rollout status deployment/product-catalog -n astronomy-shop --timeout=180s